spring.application.name=plataforma

# ===== Conexión a MySQL =====
# Puerto: 3306 por defecto. Si tu MySQL usa otro, variable de entorno DB_PORT (ej.: DB_PORT=3307)
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/turismo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
# Contraseña de MySQL: variable de entorno DB_PASSWORD (o reemplaza CAMBIAR_CLAVE solo en tu equipo, sin subirla)
spring.datasource.password=2411

# ===== JPA / Hibernate =====
# none: Hibernate no crea ni modifica tablas; las definen los scripts de src/main/resources/db
spring.jpa.hibernate.ddl-auto=none
# Usa los nombres de tablas y columnas tal cual (idUsuario, Cliente_idUsuario...), sin pasarlos a snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Administrador inicial =====
# Lo crea DataInitializer al arrancar si no existe ningún ADMIN (correo admin@viajacol.com).
# Para usar otra contraseña: variable de entorno ADMIN_PASSWORD.
app.admin.contrasenia=${ADMIN_PASSWORD:AdminViajaCol2026}
