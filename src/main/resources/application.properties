spring.application.name=plataforma

# ===== Conexión a MySQL =====
# Puerto 3307: el 3306 lo usa MariaDB en este equipo
spring.datasource.url=jdbc:mysql://localhost:3307/turismo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
# La contraseña se lee de la variable de entorno DB_PASSWORD (no se sube a GitHub)
spring.datasource.password=${DB_PASSWORD:CAMBIAR_CLAVE}

# ===== JPA / Hibernate =====
# none: Hibernate no crea ni modifica tablas; las define el script SQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true