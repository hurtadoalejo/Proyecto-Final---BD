spring.application.name=plataforma

# ===== Conexión a MySQL =====
# Puerto 3307: el 3306 lo usa MariaDB en este equipo (en otro equipo puede ser 3306)
spring.datasource.url=jdbc:mysql://localhost:3307/turismo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
# La contraseña se lee de la variable de entorno DB_PASSWORD (no se sube a GitHub)
spring.datasource.password=${DB_PASSWORD:CAMBIAR_CLAVE}

# ===== JPA / Hibernate =====
# none: Hibernate no crea ni modifica tablas; las definen los scripts de src/main/resources/db
spring.jpa.hibernate.ddl-auto=none
# Usa los nombres de tablas y columnas tal cual (idUsuario, Cliente_idUsuario...), sin pasarlos a snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== CORS =====
# Orígenes del frontend (Vite 5173, Angular 4200, CRA 3000). Varios: separados por coma.
app.cors.origenes=http://localhost:5173,http://localhost:4200,http://localhost:3000

# ===== Administrador inicial =====
# Lo crea DataInitializer al arrancar si no existe ningún ADMIN (correo admin@viajacol.com).
# Para usar otra contraseña: variable de entorno ADMIN_PASSWORD.
app.admin.contrasenia=${ADMIN_PASSWORD:AdminViajaCol2026}
